<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SCORR — Trainingsschema</title>
<meta name="description" content="Weekschema trainingen — Scorr">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green:#00FF88; --dark:#0A0E27; --dark2:#1E2749; --slate:#222C54;
    --red:#FF3B5C; --yellow:#FFD600; --white:#F0F4FF;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Lexend',sans-serif; background:var(--dark); color:var(--white); min-height:100vh; }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size:40px 40px; pointer-events:none; z-index:0;
  }
  .container { max-width:560px; margin:0 auto; position:relative; z-index:1; padding:0 16px 40px; }

  .header {
    background:linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%);
    border-bottom:2px solid rgba(0,255,136,0.3);
    padding:24px 20px 20px; text-align:center; margin:0 -16px 16px;
    position:relative; overflow:hidden;
  }
  .header::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 30% 40%, rgba(0,255,136,0.08) 0%, transparent 60%);
    pointer-events:none;
  }
  .scorr-logo { font-size:36px; font-weight:900; color:var(--green); letter-spacing:-2px; line-height:1; }
  .tagline { font-size:10px; color:rgba(240,244,255,0.5); letter-spacing:3px; text-transform:uppercase; margin-top:4px; }
  .badge {
    display:inline-flex; align-items:center; gap:6px; margin-top:12px;
    background:rgba(0,255,136,0.12); border:1px solid rgba(0,255,136,0.3);
    color:var(--green); padding:5px 14px; border-radius:20px;
    font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
  }

  .team-card {
    background:var(--dark2); border:1px solid rgba(0,255,136,0.2); border-radius:14px;
    padding:18px; text-align:center; margin-bottom:14px;
  }
  .team-naam { font-size:20px; font-weight:900; color:var(--white); line-height:1.1; }
  .team-meta { font-size:11px; color:rgba(240,244,255,0.55); margin-top:5px; letter-spacing:0.5px; }

  .week-nav {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--dark2); border:1px solid rgba(255,255,255,0.07); border-radius:12px;
    padding:10px 12px; margin-bottom:14px;
  }
  .week-nav button {
    background:rgba(0,255,136,0.08); border:1px solid rgba(0,255,136,0.25); color:var(--green);
    border-radius:8px; padding:8px 12px; font-size:13px; font-weight:700; cursor:pointer;
    font-family:inherit; min-height:36px;
  }
  .week-nav button:disabled { opacity:0.35; cursor:not-allowed; }
  .week-label { flex:1; text-align:center; }
  .week-no { font-size:14px; font-weight:900; color:var(--white); }
  .week-range { font-size:11px; color:rgba(240,244,255,0.5); margin-top:2px; }
  .week-label.this-week .week-no { color:var(--green); }

  .sessies { display:flex; flex-direction:column; gap:10px; }
  .sess-card {
    background:var(--dark2); border:1px solid rgba(255,255,255,0.07); border-radius:14px;
    padding:14px 16px; position:relative; overflow:hidden;
  }
  .sess-card.heeft-verslag { border-color:rgba(0,255,136,0.3); }
  .sess-card.afwijkend::before {
    content:''; position:absolute; top:0; left:0; bottom:0; width:3px; background:var(--yellow);
  }
  .sess-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .sess-dag { font-size:11px; font-weight:700; color:var(--green); letter-spacing:2px; text-transform:uppercase; }
  .sess-datum { font-size:11px; color:rgba(240,244,255,0.5); }
  .sess-tijd { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .sess-tijd .pill {
    font-size:11px; padding:3px 9px; border-radius:10px;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    color:rgba(240,244,255,0.85); font-weight:700;
  }
  .sess-tijd .pill.green { background:rgba(0,255,136,0.1); border-color:rgba(0,255,136,0.3); color:var(--green); }
  .sess-tijd .pill.yellow { background:rgba(255,214,0,0.1); border-color:rgba(255,214,0,0.3); color:var(--yellow); }

  .vormen-titel { font-size:9px; color:rgba(240,244,255,0.4); letter-spacing:2px; text-transform:uppercase; font-weight:700; margin-top:8px; margin-bottom:6px; }
  .vormen { display:flex; flex-wrap:wrap; gap:5px; }
  .vorm-chip {
    display:inline-flex; align-items:center; gap:5px;
    background:rgba(0,255,136,0.08); border:1px solid rgba(0,255,136,0.25);
    color:var(--white); border-radius:10px; padding:4px 9px;
    font-size:11px; font-weight:600;
  }
  .vorm-chip .ico { font-size:13px; }
  .vorm-chip.basis-onbekend { background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.1); color:rgba(240,244,255,0.7); }

  .programma-volgt {
    font-size:11px; color:rgba(240,244,255,0.4); font-style:italic;
    background:rgba(255,255,255,0.03); border:1px dashed rgba(255,255,255,0.1);
    border-radius:8px; padding:6px 10px; margin-top:6px;
  }

  .notities {
    margin-top:8px; font-size:12px; color:rgba(240,244,255,0.75); line-height:1.45;
    background:rgba(255,255,255,0.03); border-left:3px solid rgba(0,255,136,0.4);
    padding:7px 10px 7px 12px; border-radius:0 6px 6px 0;
  }

  .geen-trainingen {
    text-align:center; background:var(--dark2); border:1px dashed rgba(255,255,255,0.12);
    border-radius:14px; padding:30px 20px; color:rgba(240,244,255,0.5);
  }
  .geen-trainingen .ico { font-size:32px; margin-bottom:8px; }
  .geen-trainingen .titel { font-size:14px; font-weight:700; color:var(--white); margin-bottom:4px; }

  .footer {
    margin-top:20px; padding:14px; text-align:center; font-size:10px;
    color:rgba(240,244,255,0.3); letter-spacing:1px;
  }
  .footer a { color:var(--green); text-decoration:none; font-weight:700; }

  .loading { text-align:center; padding:60px 20px; color:rgba(240,244,255,0.5); font-size:13px; letter-spacing:1px; }
  .error-box {
    background:rgba(255,59,92,0.08); border:1px solid rgba(255,59,92,0.3);
    color:#FFB4C0; border-radius:10px; padding:14px; font-size:13px; line-height:1.5;
  }

  @media (max-width:480px) {
    .container { padding:0 12px 30px; }
    .scorr-logo { font-size:30px; }
    .team-naam { font-size:17px; }
    .week-nav button { padding:6px 10px; font-size:12px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="scorr-logo">SCORR</div>
    <div class="tagline">Live Scores. Real Football.</div>
    <div class="badge">📋 Trainingsschema</div>
  </div>

  <div id="status" class="loading">Laden...</div>

  <div id="content" style="display:none;">
    <div class="team-card">
      <div class="team-naam" id="team-naam">—</div>
      <div class="team-meta" id="team-meta"></div>
    </div>

    <div class="week-nav">
      <button id="prev-week" type="button">‹</button>
      <div class="week-label" id="week-label">
        <div class="week-no" id="week-no">Week —</div>
        <div class="week-range" id="week-range">—</div>
      </div>
      <button id="next-week" type="button">›</button>
    </div>

    <div id="sessies" class="sessies"></div>

    <div class="footer">
      Gegenereerd door <a href="https://scorr-c604a.web.app/">SCORR</a> · Real-time updates
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAputZcr7XyKRQL4-566a8gpS5R6SEL79U",
  authDomain: "scorr-c604a.firebaseapp.com",
  databaseURL: "https://scorr-c604a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "scorr-c604a",
  storageBucket: "scorr-c604a.firebasestorage.app",
  messagingSenderId: "413840042688",
  appId: "1:413840042688:web:3183c36fd20f27ac925b25"
});
const db = getDatabase(app);

// ───── Basis vormen (alleen naam + icoon — voldoende voor publieke view) ─────
const BASIS_VORMEN_MAP = {
  b1:  { naam:'Pylonenparcours',           icon:'🏃' },
  b2:  { naam:'4 tegen 4 op klein veld',   icon:'⚽' },
  b3:  { naam:'Pass & Move',               icon:'🎯' },
  b4:  { naam:'Schot uit voorzet',         icon:'🥅' },
  b5:  { naam:'Positiespel 6+2 vs 6+2',    icon:'🔁' },
  b6:  { naam:'Loopvormen buitenspeler',   icon:'➡️' },
  b7:  { naam:'1 tegen 1 verdedigen',      icon:'🛡️' },
  b8:  { naam:'Pass-trio met diepte',      icon:'🔺' },
  b9:  { naam:'Hoog druk zetten',          icon:'⚡' },
  b10: { naam:'Klein partijspel zonder keepers', icon:'🏁' }
};

const DAGEN = [
  { key:'ma', label:'Maandag'   },
  { key:'di', label:'Dinsdag'   },
  { key:'wo', label:'Woensdag'  },
  { key:'do', label:'Donderdag' },
  { key:'vr', label:'Vrijdag'   },
  { key:'za', label:'Zaterdag'  },
  { key:'zo', label:'Zondag'    }
];
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

// ───── Helpers ─────
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad(n) { return String(n).padStart(2,'0'); }
function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function getMondayOf(date) {
  const d = new Date(date); d.setHours(0,0,0,0);
  const dow = d.getDay(); // 0=zo .. 6=za
  const offset = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + offset);
  return d;
}
function isoWeekNumber(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dn);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil((((t - yearStart) / 86400000) + 1) / 7);
}
function formatDayRange(monday) {
  const end = addDays(monday, 6);
  const sM = MAANDEN[monday.getMonth()].slice(0,3);
  const eM = MAANDEN[end.getMonth()].slice(0,3);
  return monday.getDate() + ' ' + sM + ' – ' + end.getDate() + ' ' + eM;
}
function sameYMD(a, b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function parseDateParam(s) {
  if (!s) return null;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
function setUrlParams(teamId, monday) {
  const u = new URL(window.location.href);
  u.searchParams.set('team', teamId);
  u.searchParams.set('week', isoDate(monday));
  history.replaceState(null, '', u.toString());
}

// ───── State ─────
const params = new URLSearchParams(window.location.search);
const teamId = params.get('team');
let weekStart = parseDateParam(params.get('week')) || getMondayOf(new Date());
weekStart = getMondayOf(weekStart);

let teamData = null;
let eigenVormen = [];
let schemaData = {};
let sessiesData = {};
let allVormenMap = { ...BASIS_VORMEN_MAP };

function showError(msg) {
  document.getElementById('status').innerHTML = '<div class="error-box">' + msg + '</div>';
}

async function init() {
  if (!teamId) {
    showError('Geen team gevonden in de link. Vraag je trainer om een nieuwe deel-link.');
    return;
  }
  try {
    const tSnap = await get(ref(db, 'teams/' + teamId));
    if (!tSnap.exists()) {
      showError('Team niet gevonden. De link is mogelijk verlopen.');
      return;
    }
    teamData = tSnap.val();

    const [schemaSnap, sessiesSnap, eigenSnap] = await Promise.all([
      get(ref(db, 'teams/' + teamId + '/trainingen/schema')),
      get(ref(db, 'teams/' + teamId + '/trainingen/sessies')),
      get(ref(db, 'teams/' + teamId + '/trainingen/eigenVormen'))
    ]);
    schemaData  = schemaSnap.exists()  ? schemaSnap.val()  : {};
    sessiesData = sessiesSnap.exists() ? sessiesSnap.val() : {};
    eigenVormen = eigenSnap.exists()   ? Object.entries(eigenSnap.val()).map(([id, v]) => ({ id, ...v })) : [];

    eigenVormen.forEach(v => { allVormenMap[v.id] = { naam:v.naam || 'Eigen vorm', icon:v.icon || '✏️' }; });

    document.getElementById('status').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    document.getElementById('team-naam').textContent = teamData.naam || teamId;
    const meta = [teamData.categorie, teamData.klasse].filter(Boolean).join(' · ');
    document.getElementById('team-meta').textContent = meta;

    document.getElementById('prev-week').addEventListener('click', () => { weekStart = addDays(weekStart, -7); renderWeek(); });
    document.getElementById('next-week').addEventListener('click', () => { weekStart = addDays(weekStart, +7); renderWeek(); });

    renderWeek();
  } catch (err) {
    console.error(err);
    showError('Kan trainingsschema niet laden. Probeer het later opnieuw.<br><small style="opacity:0.6;">' + escapeHtml(err.message || String(err)) + '</small>');
  }
}

function renderWeek() {
  setUrlParams(teamId, weekStart);

  const todayMonday = getMondayOf(new Date());
  const isThisWeek = sameYMD(weekStart, todayMonday);

  const weekNo = isoWeekNumber(weekStart);
  document.getElementById('week-no').textContent = (isThisWeek ? 'Deze week · ' : '') + 'Week ' + weekNo;
  document.getElementById('week-range').textContent = formatDayRange(weekStart);
  document.getElementById('week-label').classList.toggle('this-week', isThisWeek);

  const list = document.getElementById('sessies');
  list.innerHTML = '';

  let aantal = 0;

  DAGEN.forEach((d, idx) => {
    const datum = addDays(weekStart, idx);
    const iso = isoDate(datum);
    const sessie = sessiesData[iso];
    const schema = schemaData[d.key] || {};
    const heeftSchema = !!schema.actief;
    if (!heeftSchema && !sessie) return;
    aantal++;

    const start = (sessie && sessie.start) || schema.start || '19:00';
    const eind  = (sessie && sessie.eind)  || schema.eind  || '20:30';
    const veld  = (sessie && sessie.veld)  || schema.veld  || 'A';
    const vormenMap = (sessie && sessie.vormen) || {};
    const vormIds = Object.keys(vormenMap).filter(k => vormenMap[k]);
    const notities = sessie ? sessie.notities : '';
    const voltooid = !!(sessie && sessie.voltooid);

    // Afwijkend van standaard schema?
    const afwijkend = sessie && heeftSchema && (
      sessie.start !== schema.start || sessie.eind !== schema.eind || sessie.veld !== schema.veld
    );

    const card = document.createElement('div');
    card.className = 'sess-card' + (voltooid && sessie.verslag ? ' heeft-verslag' : '') + (afwijkend ? ' afwijkend' : '');

    const datumStr = datum.getDate() + ' ' + MAANDEN[datum.getMonth()].slice(0,3);

    let vormenHtml = '';
    if (vormIds.length > 0) {
      vormenHtml = '<div class="vormen-titel">Programma</div><div class="vormen">'
        + vormIds.map(id => {
            const v = allVormenMap[id];
            if (v) {
              return '<span class="vorm-chip"><span class="ico">' + escapeHtml(v.icon) + '</span>' + escapeHtml(v.naam) + '</span>';
            }
            return '<span class="vorm-chip basis-onbekend">' + escapeHtml(id) + '</span>';
          }).join('')
        + '</div>';
    } else {
      vormenHtml = '<div class="programma-volgt">Programma volgt</div>';
    }

    let notitiesHtml = '';
    if (notities && notities.trim()) {
      notitiesHtml = '<div class="notities">' + escapeHtml(notities).replace(/\n/g, '<br>') + '</div>';
    }

    card.innerHTML =
      '<div class="sess-head">'
      +   '<div class="sess-dag">' + escapeHtml(d.label) + '</div>'
      +   '<div class="sess-datum">' + escapeHtml(datumStr) + '</div>'
      + '</div>'
      + '<div class="sess-tijd">'
      +   '<span class="pill green">⏱ ' + escapeHtml(start) + ' – ' + escapeHtml(eind) + '</span>'
      +   '<span class="pill">📍 Veld ' + escapeHtml(veld) + '</span>'
      +   (afwijkend ? '<span class="pill yellow">Afwijkend</span>' : '')
      + '</div>'
      + vormenHtml
      + notitiesHtml;

    list.appendChild(card);
  });

  if (aantal === 0) {
    list.innerHTML = '<div class="geen-trainingen">'
      + '<div class="ico">📭</div>'
      + '<div class="titel">Geen trainingen deze week</div>'
      + '<div>Bekijk een andere week of vraag je trainer.</div>'
      + '</div>';
  }
}

init();
</script>

</body>
</html>
